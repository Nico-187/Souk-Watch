name: Souk Kontroll-Liste

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Kontroll-Liste ausgeben
        env:
          PARFUMO_USER: ${{ secrets.PARFUMO_USER }}
          PARFUMO_PASS: ${{ secrets.PARFUMO_PASS }}
        run: python list_now.py
