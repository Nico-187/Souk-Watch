name: Parfumo Souk Watcher

on:
  schedule:
    # Stündlich von 06:15 bis 22:15 deutscher Zeit (= 04–20 UTC im Sommer/CEST).
    # Minute :15 statt :00, weil GitHub zur vollen Stunde am unzuverlässigsten ist.
    # Hinweis: im Winter (CET = UTC+1) verschiebt sich das auf 05–21 Uhr.
    - cron: '15 4-20 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed-Modus: aktuelle Angebote nur merken, NICHT melden (gegen Erst-Schwung)'
        type: boolean
        default: false

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Scraper ausführen
        env:
          PARFUMO_USER: ${{ secrets.PARFUMO_USER }}
          PARFUMO_PASS: ${{ secrets.PARFUMO_PASS }}
          NTFY_TOPIC:   ${{ secrets.NTFY_TOPIC }}
          SEED:         ${{ github.event.inputs.seed }}
        run: python scraper.py

      - name: Seen-Items speichern
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_items.json
          git diff --staged --quiet || git commit -m "chore: update seen items [skip ci]"
          git push
