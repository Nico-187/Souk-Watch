name: Parfumo Souk Watcher

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed-Modus: aktuelle Angebote nur merken, NICHT melden (gegen Erst-Schwung)'
        type: boolean
        default: false

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Scraper ausführen
        env:
          PARFUMO_USER: ${{ secrets.PARFUMO_USER }}
          PARFUMO_PASS: ${{ secrets.PARFUMO_PASS }}
          NTFY_TOPIC:   ${{ secrets.NTFY_TOPIC }}
          SEED:         ${{ github.event.inputs.seed }}
        run: python scraper.py

      - name: Seen-Items speichern
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_items.json
          git diff --staged --quiet || git commit -m "chore: update seen items [skip ci]"
          git push
